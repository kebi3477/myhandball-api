# 미니 PC 배포: API + Postgres + Redis + Caddy(HTTPS)
#
#   cd deploy
#   cp .env.example .env   # 값 채우기
#   docker compose up -d --build
#
# 자세한 순서는 deploy/README.md

name: myhandball

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      BASE: https://www.koreahandball.com
      DATABASE_URL: postgres://myhandball:${POSTGRES_PASSWORD:?deploy/.env에 POSTGRES_PASSWORD 필요}@postgres:5432/myhandball
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379/0
      # Caddy가 다른 컨테이너(사설망)라서 그 IP를 믿어야 실제 클라이언트 IP가 보인다
      TRUST_PROXY: uniquelocal
      CURRENT_SEASON: ${CURRENT_SEASON:-}
      # 연맹이 일정보다 먼저 발표한 개막일 (GET /api/season). 형식 "<시즌>=<ISO 시각>"
      SEASON_OPENS_AT_M: ${SEASON_OPENS_AT_M:-}
      SEASON_OPENS_AT_W: ${SEASON_OPENS_AT_W:-}
      LIVE_POLLING: ${LIVE_POLLING:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:-}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY:-}
      # 응원글 작성자 ID(HMAC) 비밀값. 한 번 정하면 바꾸지 않는다 (바꾸면 차단 목록이 어긋남)
      AUTHOR_ID_SECRET: ${AUTHOR_ID_SECRET:?deploy/.env에 AUTHOR_ID_SECRET 필요}
      # 앱 업데이트 안내 (GET /api/app/version). 비우면 그 플랫폼은 404 → 앱이 안내를 안 띄움
      APP_ANDROID_LATEST_VERSION: ${APP_ANDROID_LATEST_VERSION:-}
      APP_ANDROID_MIN_VERSION: ${APP_ANDROID_MIN_VERSION:-}
      APP_ANDROID_STORE_URL: ${APP_ANDROID_STORE_URL:-}
      APP_ANDROID_NOTES: ${APP_ANDROID_NOTES:-}
      APP_IOS_LATEST_VERSION: ${APP_IOS_LATEST_VERSION:-}
      APP_IOS_MIN_VERSION: ${APP_IOS_MIN_VERSION:-}
      APP_IOS_STORE_URL: ${APP_IOS_STORE_URL:-}
      APP_IOS_NOTES: ${APP_IOS_NOTES:-}
      # 관리자 페이지 (https://<도메인>/api/admin). 비우면(또는 24자 미만) 관리자 기능이 꺼진다
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # DB 백업 (매일 04:00 KST, 최근 BACKUP_KEEP개). 파일은 호스트의 deploy/backups 에 남는다
      BACKUP_DIR: /app/backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 외부에 직접 열지 않는다. Caddy를 거쳐서만 들어온다
    expose:
      - "3000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: myhandball
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env에 POSTGRES_PASSWORD 필요}
      POSTGRES_DB: myhandball
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myhandball -d myhandball"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
      # 집 안(같은 공유기) 전용 HTTP 입구. 공유기에서 포워딩하지 않는다 (deploy/Caddyfile 참고)
      - "${LAN_HTTP_PORT:-8080}:8080"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?deploy/.env에 ACME_EMAIL 필요}
      DOMAIN: ${DOMAIN:-myhandball.lab241.com}
      API_UPSTREAM: api:3000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 인증서·ACME 계정이 여기 저장된다. 지우면 재발급 (발급 한도에 걸릴 수 있음)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
